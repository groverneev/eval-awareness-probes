[project]
name = "vnaa"
version = "0.1.0"
description = "Probing evaluation awareness in realistic multi-turn conversations"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "numpy>=1.26",
    "tqdm>=4.66",
    "huggingface_hub>=0.24",
    "PyYAML>=6.0",
    "accelerate>=0.30",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vnaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
